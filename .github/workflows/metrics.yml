name: Refresh language activity

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
    steps:
      - name: Explain missing token
        if: ${{ env.METRICS_TOKEN == '' }}
        run: echo "Add the METRICS_TOKEN repository secret to render language activity."

      - name: Generate in-depth language activity
        if: ${{ env.METRICS_TOKEN != '' }}
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: metrics.languages.svg
          base: ""
          config_order: languages
          plugin_languages: yes
          plugin_languages_indepth: yes
          commits_authoring: Swarit Sawarkar, swaritsawarkar, 273532413+swaritsawarkar@users.noreply.github.com
          plugin_languages_details: bytes-size, percentage
          plugin_languages_sections: most-used, recently-used
          plugin_languages_limit: 8
          plugin_languages_analysis_timeout: 15
          plugin_languages_analysis_timeout_repositories: 7
          plugin_languages_skipped: swaritsawarkar
