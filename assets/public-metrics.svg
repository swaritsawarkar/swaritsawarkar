    </style>
  </defs>
  <rect width="1200" height="510" rx="20" fill="url(#bg)"/><rect x="1" y="1" width="1198" height="508" rx="19" fill="none" stroke="#1e3a5f"/><rect width="1200" height="510" rx="20" fill="url(#grid)"/>
